<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob: data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>附件内容</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="viewer.css" />
    <script type="module" src="viewer.js"></script>
  </head>
  <body>
    <main id="surface" aria-label="文档内容"></main>
    <div id="viewer-state" role="status">正在打开附件…</div>
    <footer id="viewer-bar" hidden>
      <button id="prev-page" aria-label="上一页" title="上一页">‹</button>
      <span id="page-label"></span>
      <button id="next-page" aria-label="下一页" title="下一页">›</button>
      <span class="spacer"></span>
      <button id="less" aria-label="缩小" title="缩小">−</button>
      <button id="fit" title="适合窗口">适合窗口</button>
      <button id="plus" aria-label="放大" title="放大">＋</button>
    </footer>
  </body>
</html>
